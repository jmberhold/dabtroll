name: CPU research contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do bash -n "$script" || exit; done
      - name: Validate curated notebook format
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          for name in (
              "btaudit2_research_tutorial.ipynb",
              "VIBTARVE_Visualization.ipynb",
              "VIBTRAVE_Visualizations.ipynb",
              "VIBTARVE_Progress.ipynb",
          ):
              notebook = nbformat.read(Path("notebooks") / name, as_version=4)
              nbformat.validate(notebook)
              for cell in notebook.cells:
                  if cell.cell_type == "code":
                      assert not cell.outputs and cell.execution_count is None, name
          PY
